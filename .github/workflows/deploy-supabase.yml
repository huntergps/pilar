# =============================================================================
# PILAR ERP — Deploy Supabase (migraciones + Edge Functions)
#
# Se ejecuta automáticamente al hacer push a main cuando hay cambios en:
#   - foundation/      (migraciones y funciones base)
#   - modules/         (migraciones y funciones de módulos)
#   - scripts/         (build-supabase.sh)
#
# Secrets necesarios en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN        Personal access token de Supabase (sbp_...)
#   SUPABASE_SERVICE_ROLE_KEY    Service role key del proyecto (eyJ... legacy JWT)
#   PILAR_SUPER_ADMIN_EMAIL      Email del superusuario inicial (ej: admin@empresa.com)
#   PILAR_SUPER_ADMIN_PASSWORD   Contraseña inicial del superusuario
#   PILAR_SEED_EMPRESA_NOMBRE    Nombre de la primera empresa (ej: "Mi Empresa S.A.")
#   PILAR_SEED_EMPRESA_RUC       RUC de la primera empresa (ej: "1234567890001")
# =============================================================================

name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'foundation/**'
      - 'modules/**'
      - 'scripts/**'

  # Permite ejecutar manualmente desde GitHub Actions UI
  workflow_dispatch:
    inputs:
      modules:
        description: 'Módulos a incluir (vacío = todos, ej: "facturacion ventas")'
        required: false
        default: ''
      skip_modules:
        description: 'Módulos a excluir (ej: "ia rrhh")'
        required: false
        default: ''

env:
  SUPABASE_PROJECT_REF: bsqhqmmxnfyufozhyszj

jobs:
  deploy:
    name: Build & Push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Supabase CLI ───────────────────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── 3. Build — ensambla foundation + módulos en foundation/supabase/ ─────
      - name: Build Supabase (assemble migrations)
        run: |
          chmod +x scripts/build-supabase.sh

          if [[ -n "${{ github.event.inputs.modules }}" ]]; then
            # Solo los módulos especificados manualmente
            FIRST=$(echo "${{ github.event.inputs.modules }}" | awk '{print $1}')
            REST=$(echo "${{ github.event.inputs.modules }}" | cut -d' ' -f2-)
            ./scripts/build-supabase.sh --only $FIRST
          elif [[ -n "${{ github.event.inputs.skip_modules }}" ]]; then
            ./scripts/build-supabase.sh --skip ${{ github.event.inputs.skip_modules }}
          else
            ./scripts/build-supabase.sh
          fi

      # ── 4. Link al proyecto Supabase ─────────────────────────────────────────
      - name: Link Supabase project
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_REF }}
        working-directory: foundation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 5. Push migrations ───────────────────────────────────────────────────
      - name: Push database migrations
        run: supabase db push
        working-directory: foundation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 6. Deploy Edge Functions ─────────────────────────────────────────────
      - name: Deploy Edge Functions
        run: |
          # Despliega todas las funciones en foundation/supabase/functions/
          # (excluyendo _shared que es solo código compartido, no función deployable)
          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            if [[ "$fn_name" != "_shared" ]]; then
              echo "Deploying function: $fn_name"
              supabase functions deploy "$fn_name" || echo "Warning: failed to deploy $fn_name"
            fi
          done
        working-directory: foundation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 7. Habilitar Custom Access Token Hook ────────────────────────────────
      # CRÍTICO: sin este hook, private.get_empresa_id() devuelve NULL y todas
      # las RLS policies fallan. Se activa via Management API (idempotente).
      - name: Enable Custom Access Token Hook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/${{ env.SUPABASE_PROJECT_REF }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "hook_custom_access_token_enabled": true,
              "hook_custom_access_token_uri": "pg-functions://postgres/public/custom_access_token_hook"
            }')
          if [[ "$RESPONSE" == "200" ]]; then
            echo "✓ Custom Access Token Hook habilitado"
          else
            echo "✗ Error habilitando hook (HTTP $RESPONSE)"
            exit 1
          fi

      # ── 8. Configurar secrets en vault para webhook pg_net ───────────────────
      # Estos secretos son leídos por trigger_empresa_storage_setup() que crea
      # el bucket Storage privado de cada empresa al hacer INSERT en empresas.
      # Se usa Python para construir el JSON/SQL de forma segura (sin escaping hell).
      - name: Configure vault secrets for pg_net webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          token   = os.environ['SUPABASE_ACCESS_TOKEN']
          srk     = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          ref     = os.environ['SUPABASE_PROJECT_REF']
          sup_url = f"https://{ref}.supabase.co"

          # SQL con dollar-quoting para evitar conflictos con single quotes en los valores
          # Los valores se escapan con replace("'", "''") al estilo SQL estándar
          def sql_str(v):
              return "'" + v.replace("'", "''") + "'"

          sql = f"""
          DO $q$
          DECLARE v_id UUID;
          BEGIN
            SELECT id INTO v_id FROM vault.secrets WHERE name = 'pilar_supabase_url';
            IF v_id IS NULL THEN
              PERFORM vault.create_secret({sql_str(sup_url)}, 'pilar_supabase_url', 'PILAR Supabase project URL');
            ELSE
              PERFORM vault.update_secret(v_id, {sql_str(sup_url)});
            END IF;

            SELECT id INTO v_id FROM vault.secrets WHERE name = 'pilar_service_role_key';
            IF v_id IS NULL THEN
              PERFORM vault.create_secret({sql_str(srk)}, 'pilar_service_role_key', 'PILAR service role key para webhooks internos');
            ELSE
              PERFORM vault.update_secret(v_id, {sql_str(srk)});
            END IF;
          END $q$;
          """

          req = urllib.request.Request(
            f'https://api.supabase.com/v1/projects/{ref}/database/query',
            data=json.dumps({'query': sql}).encode(),
            headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
            },
            method='POST'
          )
          try:
            with urllib.request.urlopen(req) as resp:
              print(f"✓ vault secrets configurados (HTTP {resp.status})")
          except urllib.error.HTTPError as e:
            body = e.read().decode()
            print(f"✗ Error configurando vault secrets: {body}", file=sys.stderr)
            sys.exit(1)
          PYEOF

      # ── 9. Catch-up: crear buckets Storage para empresas sin bucket ──────────
      # Ejecuta auth-setup-handler para empresas que no tienen bucket aún.
      # Idempotente: la función ignora "bucket already exists".
      - name: Create missing Storage buckets (catch-up)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SUPABASE_URL="https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co"

          # Obtener lista de empresa_ids sin bucket
          EMPRESA_IDS=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/${{ env.SUPABASE_PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT e.id::text FROM empresas e WHERE NOT EXISTS (SELECT 1 FROM storage.buckets b WHERE b.id = e.id::text)"}' \
            | jq -r '.[].id // empty')

          if [[ -z "$EMPRESA_IDS" ]]; then
            echo "✓ Todos los buckets de empresa están creados"
          else
            for EMPRESA_ID in $EMPRESA_IDS; do
              echo "Creando bucket para empresa: $EMPRESA_ID"
              curl -s -X POST \
                "${SUPABASE_URL}/functions/v1/auth-setup-handler" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"empresa_id\": \"${EMPRESA_ID}\"}" | jq -c .
            done
          fi

      # ── 10. Crear usuario inicial (primer despliegue) ─────────────────────────
      # Crea el usuario administrador en Supabase Auth si no existe.
      # Usa la Auth Admin API con email_confirm=true para no requerir verificación.
      # Idempotente: si el usuario ya existe (HTTP 422), lo ignora.
      - name: Create initial auth user
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PILAR_SUPER_ADMIN_EMAIL: ${{ secrets.PILAR_SUPER_ADMIN_EMAIL }}
          PILAR_SUPER_ADMIN_PASSWORD: ${{ secrets.PILAR_SUPER_ADMIN_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$PILAR_SUPER_ADMIN_EMAIL" || -z "$PILAR_SUPER_ADMIN_PASSWORD" ]]; then
            echo "ℹ️  PILAR_SUPER_ADMIN_EMAIL o PASSWORD no configurados — saltando"
            exit 0
          fi

          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          srk      = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          email    = os.environ['PILAR_SUPER_ADMIN_EMAIL']
          password = os.environ['PILAR_SUPER_ADMIN_PASSWORD']
          ref      = os.environ['SUPABASE_PROJECT_REF']

          url = f"https://{ref}.supabase.co/auth/v1/admin/users"
          payload = {
            "email": email,
            "password": password,
            "email_confirm": True,
          }
          req = urllib.request.Request(
            url,
            data=json.dumps(payload).encode(),
            headers={
              "apikey": srk,
              "Authorization": f"Bearer {srk}",
              "Content-Type": "application/json",
            },
            method="POST"
          )
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
              print(f"✓ Usuario creado: {data.get('email')}")
          except urllib.error.HTTPError as e:
            body = e.read().decode()
            # 422 = usuario ya existe
            if e.code == 422:
              print(f"✓ Usuario ya existe: {email}")
            else:
              print(f"✗ Error creando usuario (HTTP {e.code}): {body}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      # ── 11. Seed primera empresa (primer despliegue) ──────────────────────────
      # Si no existe ninguna empresa, crea la primera con los datos configurados.
      # Idempotente: si ya hay empresas, es un no-op.
      - name: Seed primera empresa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PILAR_SUPER_ADMIN_EMAIL: ${{ secrets.PILAR_SUPER_ADMIN_EMAIL }}
          PILAR_SEED_EMPRESA_NOMBRE: ${{ secrets.PILAR_SEED_EMPRESA_NOMBRE }}
          PILAR_SEED_EMPRESA_RUC: ${{ secrets.PILAR_SEED_EMPRESA_RUC }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$PILAR_SUPER_ADMIN_EMAIL" || -z "$PILAR_SEED_EMPRESA_NOMBRE" ]]; then
            echo "ℹ️  PILAR_SEED_EMPRESA_NOMBRE no configurado — saltando"
            exit 0
          fi

          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          token   = os.environ['SUPABASE_ACCESS_TOKEN']
          email   = os.environ['PILAR_SUPER_ADMIN_EMAIL']
          nombre  = os.environ['PILAR_SEED_EMPRESA_NOMBRE']
          ruc     = os.environ.get('PILAR_SEED_EMPRESA_RUC', '9999999999999')
          ref     = os.environ['SUPABASE_PROJECT_REF']

          def sql_str(v):
              return "'" + v.replace("'", "''") + "'"

          sql = f"""
          SELECT service_seed_primera_empresa(
            {sql_str(email)},
            {sql_str(nombre)},
            {sql_str(ruc)},
            'Profesional'
          ) as resultado
          """

          req = urllib.request.Request(
            f'https://api.supabase.com/v1/projects/{ref}/database/query',
            data=json.dumps({'query': sql}).encode(),
            headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
            },
            method='POST'
          )
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
              resultado = data[0]['resultado'] if data else {}
              if resultado.get('ok'):
                print(f"✓ {resultado.get('message', 'OK')}")
              else:
                print(f"✗ Error seed empresa: {resultado.get('message')}", file=sys.stderr)
                sys.exit(1)
          except urllib.error.HTTPError as e:
            body = e.read().decode()
            print(f"✗ Error llamando service_seed_primera_empresa: {body}", file=sys.stderr)
            sys.exit(1)
          PYEOF

      # ── 12. Bootstrap superadmin ──────────────────────────────────────────────
      # Asigna rol SUPER_ADMIN al usuario configurado en PILAR_SUPER_ADMIN_EMAIL.
      # Idempotente: si ya tiene el rol, no hace nada.
      # Solo se ejecuta si el secret está configurado.
      - name: Bootstrap superadmin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PILAR_SUPER_ADMIN_EMAIL: ${{ secrets.PILAR_SUPER_ADMIN_EMAIL }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$PILAR_SUPER_ADMIN_EMAIL" ]]; then
            echo "ℹ️  PILAR_SUPER_ADMIN_EMAIL no configurado — saltando bootstrap"
            exit 0
          fi

          python3 << 'PYEOF'
          import os, json, urllib.request, sys

          token = os.environ['SUPABASE_ACCESS_TOKEN']
          email = os.environ['PILAR_SUPER_ADMIN_EMAIL']
          ref   = os.environ['SUPABASE_PROJECT_REF']

          def sql_str(v):
              return "'" + v.replace("'", "''") + "'"

          sql = f"SELECT bootstrap_superadmin({sql_str(email)}) as resultado"

          req = urllib.request.Request(
            f'https://api.supabase.com/v1/projects/{ref}/database/query',
            data=json.dumps({'query': sql}).encode(),
            headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
            },
            method='POST'
          )
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
              resultado = data[0]['resultado'] if data else {}
              if resultado.get('ok'):
                print(f"✓ Superadmin: {resultado.get('message', 'OK')}")
              else:
                print(f"✗ Error bootstrap: {resultado.get('message')}", file=sys.stderr)
                sys.exit(1)
          except urllib.error.HTTPError as e:
            body = e.read().decode()
            print(f"✗ Error llamando bootstrap_superadmin: {body}", file=sys.stderr)
            sys.exit(1)
          PYEOF
