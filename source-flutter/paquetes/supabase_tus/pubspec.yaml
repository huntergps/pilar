name: supabase_tus
description: >
  TUS resumable upload client for Supabase Storage.
  Implements POST/PATCH/HEAD of the TUS 1.0.0 protocol with automatic
  resume (SharedPreferences cache), progress streaming, and cancellation.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  meta: ^1.15.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
